version: 1
pipeline_id: release-evidence-review
request_correlation_id: auto

runtime:
  engine: docker
  default_network: none
  registry: registry.internal/security-platform
  tag: 0.1.2

artifacts_root: ../../artifacts/pipelines/release-evidence-review

steps:
  - id: schema-validator
    image: spt-schema-validator
    command: ["run-schema-validator"]
    required: true
    env:
      TARGET_DIR: /workspace/artifacts/release-evidence
    mounts:
      - source: ../..
        target: /workspace
        mode: ro
      - source: ../../artifacts/pipelines/release-evidence-review/steps/01-schema-validator
        target: /artifacts
        mode: rw
    expected_artifacts:
      - /artifacts/job-report.json
      - /artifacts/results/schema-validator/tool-result.json
    schema_validation:
      - path: /artifacts/results/schema-validator/tool-result.json
        schema: schemas/tool-result.schema.json
