# security-platform-toolchain — docker-compose.yml
# Runs every tool image with a shared workspace volume.
# Override REGISTRY, TAG, WORKSPACE, and TARGET_REPO at runtime.
#
#   docker-compose run --rm semgrep
#   WORKSPACE=/path/to/repo docker-compose run --rm codeql

version: "3.9"

x-common: &common
  restart: "no"
  environment:
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - JOB_ID=${JOB_ID:-local}
    - ARTIFACTS_DIR=/artifacts
  volumes:
    - workspace:/workspace
    - artifacts:/artifacts

services:

  base:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    build:
      context: .
      dockerfile: images/base/Dockerfile

  schema-validator:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-schema-validator:${TAG:-latest}
    build:
      context: .
      dockerfile: images/schema-validator/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - VALIDATE_TARGET=/artifacts
    volumes:
      - artifacts:/artifacts

  result-normalizers:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-result-normalizers:${TAG:-latest}
    build:
      context: .
      dockerfile: images/result-normalizers/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - NORMALIZER_INPUT=/artifacts/results
      - NORMALIZER_FORMAT=auto
    volumes:
      - artifacts:/artifacts

  c-cpp-analysis:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-c-cpp-analysis:${TAG:-latest}
    build:
      context: .
      dockerfile: images/c-cpp-analysis/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - TARGET_REPO=/workspace
    volumes:
      - ${WORKSPACE:-.}:/workspace:ro
      - artifacts:/artifacts

  coverage-tools:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-coverage-tools:${TAG:-latest}
    build:
      context: .
      dockerfile: images/coverage-tools/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  osv-scanner:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-osv-scanner:${TAG:-latest}
    build:
      context: .
      dockerfile: images/osv-scanner/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  image-scanner:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-image-scanner:${TAG:-latest}
    build:
      context: .
      dockerfile: images/image-scanner/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  re-lightweight:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-re-lightweight:${TAG:-latest}
    build:
      context: .
      dockerfile: images/re-lightweight/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  yara:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-yara:${TAG:-latest}
    build:
      context: .
      dockerfile: images/yara/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  intel-ingest:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-intel-ingest:${TAG:-latest}
    build:
      context: .
      dockerfile: images/intel-ingest/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  rag-indexer:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-rag-indexer:${TAG:-latest}
    build:
      context: .
      dockerfile: images/rag-indexer/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  diff-impact:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-diff-impact:${TAG:-latest}
    build:
      context: .
      dockerfile: images/diff-impact/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  ghidra-base:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-ghidra-base:${TAG:-latest}
    build:
      context: .
      dockerfile: images/ghidra-base/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
        GHIDRA_VERSION: ${GHIDRA_VERSION:-12.0.4}
        GHIDRA_DATE: ${GHIDRA_DATE:-20260303}

  ghidra-exporter:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-ghidra-exporter:${TAG:-latest}
    build:
      context: .
      dockerfile: images/ghidra-exporter/Dockerfile
      args:
        GHIDRA_BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-ghidra-base:${TAG:-latest}

  ghidra-mcp:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-ghidra-mcp:${TAG:-latest}
    build:
      context: .
      dockerfile: images/ghidra-mcp/Dockerfile
      args:
        GHIDRA_BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-ghidra-base:${TAG:-latest}
        GHIDRA_VERSION: ${GHIDRA_VERSION:-12.0.4}
        GHIDRA_MCP_REPO: ${GHIDRA_MCP_REPO:-https://github.com/bethington/ghidra-mcp.git}
        GHIDRA_MCP_REF: ${GHIDRA_MCP_REF:-v5.5.0}

  eval-runner:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-eval-runner:${TAG:-latest}
    build:
      context: .
      dockerfile: images/eval-runner/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  fuzzing:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-fuzzing:${TAG:-latest}
    build:
      context: .
      dockerfile: images/fuzzing/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - FUZZ_TARGET=${FUZZ_TARGET:-}
      - FUZZ_TIMEOUT=${FUZZ_TIMEOUT:-300}
    volumes:
      - ${WORKSPACE:-.}:/workspace:ro
      - artifacts:/artifacts
    security_opt:
      - seccomp:unconfined   # required by AFL++

  harness-builder:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-harness-builder:${TAG:-latest}
    build:
      context: .
      dockerfile: images/harness-builder/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  protocol-fuzzing:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-protocol-fuzzing:${TAG:-latest}
    build:
      context: .
      dockerfile: images/protocol-fuzzing/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  crash-triage:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-crash-triage:${TAG:-latest}
    build:
      context: .
      dockerfile: images/crash-triage/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}

  gitnexus:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-gitnexus:${TAG:-latest}
    build:
      context: .
      dockerfile: images/gitnexus/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - NEXUS_URL=${NEXUS_URL:-}
      - NEXUS_USER=${NEXUS_USER:-}
      - NEXUS_PASS=${NEXUS_PASS:-}
      - GIT_REPO=${GIT_REPO:-}
      - GIT_REF=${GIT_REF:-HEAD}
    volumes:
      - ${WORKSPACE:-.}:/workspace
      - artifacts:/artifacts

  semgrep:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-semgrep:${TAG:-latest}
    build:
      context: .
      dockerfile: images/semgrep/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - SEMGREP_RULES=/rules
      - TARGET_REPO=/workspace
    volumes:
      - ${WORKSPACE:-.}:/workspace:ro
      - ./rules/semgrep:/rules:ro
      - artifacts:/artifacts

  codeql:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-codeql:${TAG:-latest}
    build:
      context: .
      dockerfile: images/codeql/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - CODEQL_LANGUAGE=${CODEQL_LANGUAGE:-cpp}
      - TARGET_REPO=/workspace
    volumes:
      - ${WORKSPACE:-.}:/workspace:ro
      - ./queries/codeql:/queries:ro
      - artifacts:/artifacts

  sbom:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-sbom:${TAG:-latest}
    build:
      context: .
      dockerfile: images/sbom/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - SBOM_FORMAT=${SBOM_FORMAT:-cyclonedx-json}
      - TARGET_REPO=/workspace
    volumes:
      - ${WORKSPACE:-.}:/workspace:ro
      - artifacts:/artifacts

  secrets:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-secrets:${TAG:-latest}
    build:
      context: .
      dockerfile: images/secrets/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - TARGET_REPO=/workspace
    volumes:
      - ${WORKSPACE:-.}:/workspace:ro
      - artifacts:/artifacts

  corpus-tools:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-corpus-tools:${TAG:-latest}
    build:
      context: .
      dockerfile: images/corpus-tools/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - CORPUS_DIR=${CORPUS_DIR:-/workspace/corpus}
    volumes:
      - ${WORKSPACE:-.}:/workspace
      - artifacts:/artifacts

  replay-runner:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-replay-runner:${TAG:-latest}
    build:
      context: .
      dockerfile: images/replay-runner/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - REPLAY_TARGET=${REPLAY_TARGET:-}
      - CRASH_DIR=${CRASH_DIR:-/workspace/crashes}
    volumes:
      - ${WORKSPACE:-.}:/workspace:ro
      - artifacts:/artifacts

  symbolic:
    <<: *common
    image: ${REGISTRY:-registry.internal/security-platform}/spt-symbolic:${TAG:-latest}
    build:
      context: .
      dockerfile: images/symbolic/Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-registry.internal/security-platform}/spt-base:${TAG:-latest}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JOB_ID=${JOB_ID:-local}
      - ARTIFACTS_DIR=/artifacts
      - SYMBOLIC_ENGINE=${SYMBOLIC_ENGINE:-angr}
      - TARGET_BINARY=${TARGET_BINARY:-}
    volumes:
      - ${WORKSPACE:-.}:/workspace:ro
      - artifacts:/artifacts

volumes:
  workspace:
  artifacts:
